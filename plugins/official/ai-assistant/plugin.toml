id = "ai-assistant"
name = "AI assistant"
version = "0.1.0"
api = 1
min_api = "1.4.0"
min_app = "0.2.0"
main = "main.js"
description = "Ask Claude or Codex with the subscription you already have, or a model with your own key. Off until you turn it on"
author = "Vaultdraw"
permissions = ["net", "secret", "cli", "vault.read", "vault.write"]

[[contributes.panels]]
id = "assistant"
title = "AI assistant"

[[contributes.commands]]
id = "ask"
title = "AI: Ask about this drawing"
when = ["vaultOpen"]

[[contributes.commands]]
id = "describe"
title = "AI: Describe the selection"
when = ["drawingOpen"]

[[contributes.commands]]
id = "diagram"
title = "AI: Generate a diagram from text"
when = ["drawingOpen"]

[[contributes.commands]]
id = "summarise"
title = "AI: Summarise this note"
when = ["vaultOpen"]

[[contributes.commands]]
id = "edit"
title = "AI: Edit this drawing"
when = ["drawingOpen"]

[[contributes.commands]]
id = "create"
title = "AI: Create a new drawing"
when = ["vaultOpen"]

[[contributes.commands]]
id = "keep"
title = "AI: Keep the proposed change"

[[contributes.commands]]
id = "discard"
title = "AI: Discard the proposed change"

[[contributes.commands]]
id = "cancel"
title = "AI: Stop the answer"

[[contributes.commands]]
id = "clear"
title = "AI: Clear the conversation"

[[contributes.commands]]
id = "new-chat"
title = "AI: New chat"

[[contributes.commands]]
id = "history"
title = "AI: Chat history"

[[contributes.commands]]
id = "choose-model"
title = "AI: Choose model"

[[contributes.commands]]
id = "cycle-effort"
title = "AI: Cycle reasoning effort"

[[contributes.commands]]
id = "settings"
title = "AI: Connect and settings"

[[contributes.commands]]
id = "open"
title = "AI: Open the assistant"

[[contributes.commands]]
id = "set-key"
title = "AI: Set API key"

[[contributes.commands]]
id = "remove-key"
title = "AI: Remove API key"

[[contributes.settings]]
key = "provider"
type = "select"
title = "Provider"
description = "Automatic uses the Claude or Codex command line if it is on this computer, else Anthropic. Claude and Codex use your own signed-in subscription and need no key. Anthropic and OpenAI need your own key. Ollama runs on your computer, or on another one you allow, and needs no key. For another OpenAI-style service or server, pick OpenAI and set its address."
default = "auto"
options = [{ value = "auto", label = "Automatic" }, { value = "claude-cli", label = "Claude (your subscription)" }, { value = "codex-cli", label = "Codex (your subscription)" }, { value = "anthropic", label = "Anthropic (API key)" }, { value = "openai", label = "OpenAI or compatible (API key)" }, { value = "ollama", label = "Ollama" }]
scope = ["global"]

[[contributes.settings]]
key = "model"
type = "string"
title = "Model"
description = "The model name the provider knows. Empty uses the provider's default."
default = ""
scope = ["global"]

[[contributes.settings]]
key = "effort"
type = "select"
title = "Reasoning effort"
description = "How hard the model thinks, where the provider has levels (Claude, Codex, OpenAI). Default leaves it to the provider."
default = ""
options = [{ value = "", label = "Default" }, { value = "low", label = "Low" }, { value = "medium", label = "Medium" }, { value = "high", label = "High" }, { value = "xhigh", label = "Extra high" }, { value = "max", label = "Max (Claude)" }]
scope = ["global"]

[[contributes.settings]]
key = "context"
type = "select"
title = "What is sent"
description = "What a question includes from the drawing: the selection if there is one else the whole drawing, always the whole drawing, only the selection, or nothing. You can change it for one chat from the chip above the box."
default = "auto"
options = [{ value = "auto", label = "Selection, or the whole drawing" }, { value = "drawing", label = "The whole drawing" }, { value = "selection", label = "Only the selection" }, { value = "none", label = "Nothing from the drawing" }]
scope = ["global"]

[[contributes.settings]]
key = "base_url"
type = "string"
title = "Address"
description = "Where requests go. Empty uses the provider's usual address. https, or http to this computer, or to a computer on your network that you listed in config.toml."
default = ""
scope = ["global"]

[[contributes.settings]]
key = "timeout_s"
type = "int"
title = "Timeout"
description = "Seconds to wait for a connection and between parts of the answer."
default = 60
min = 5
max = 600
scope = ["global"]

[[contributes.settings]]
key = "max_context_chars"
type = "int"
title = "Most drawing text to send"
description = "The drawing is sent as text; anything past this many characters is left out. Click the chip above the box in the panel to see exactly what is sent."
default = 12000
min = 500
max = 200000
scope = ["global"]

[[contributes.settings]]
key = "edit_max_ops"
type = "int"
title = "Most changes in one proposal"
description = "A proposed edit or new drawing keeps at most this many changes; the rest of the model's reply is left out."
default = 60
min = 1
max = 500
scope = ["global"]

[[contributes.settings]]
key = "create_folder"
type = "string"
title = "Folder for new AI drawings"
description = "Where \"AI: Create a new drawing\" saves, after you keep it. Empty is the vault's top folder. The folder must exist."
default = ""
scope = ["global"]
